<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="pn.css">
<style>body{margin:0;background:#09090b}a{color:#7aa2ff}a:hover{color:#3b74ff}</style>
</helmet>
<div style="padding:64px;background:#09090b;color:#fafafa;font-family:var(--font-body);min-width:max-content">
  <div style="display:flex;align-items:flex-end;gap:48px;border-bottom:2px solid #ffffff26;padding-bottom:24px;margin-bottom:48px">
    <div><div style="font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7aa2ff">02</div><h1 style="font-size:72px;letter-spacing:-.04em;margin:0;line-height:1">Client app</h1></div>
    <p style="max-width:560px;margin:0;font-size:17px;color:#a1a1aa">iPhone 390 × 844, dark first. Every frame is live: tap through it, or open <a href="Client Prototype.dc.html">Client Prototype</a> for the full click-through from onboarding. Frame names match docs/app-sketch.md.</p>
    <div style="display:flex;gap:16px;font-size:15px;margin-left:auto"><a href="00 Cover and Direction.dc.html">00 Cover</a><a href="01 Design System.dc.html">01 System</a><a href="03 Provider Dashboard.dc.html">03 Provider</a><a href="04 Flows.dc.html">04 Flows</a><a href="05 Open Questions.dc.html">05 Questions</a></div>
  </div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
    <section style="margin-bottom:72px">
      <h2 style="font-size:32px;letter-spacing:-.02em;margin:0 0 6px">{{ g.n }}</h2>
      <p style="margin:0 0 24px;color:#a1a1aa;font-size:16px;max-width:900px">{{ g.note }}</p>
      <div style="display:flex;gap:40px;flex-wrap:nowrap">
        <sc-for list="{{ g.frames }}" as="f" hint-placeholder-count="4">
          <div data-frame="{{ f.id }}" style="display:flex;flex-direction:column;gap:12px">
            <div style="font-size:14px;font-weight:700;display:flex;gap:10px"><span style="color:#7aa2ff">{{ f.num }}</span>{{ f.label }}</div>
            <div style="box-shadow:0 0 0 1px #ffffff1f,0 24px 60px #000;border-radius:48px;overflow:hidden">
              <dc-import name="Client Screen" screen="{{ f.k }}" theme="{{ f.theme }}" btab="{{ f.btab }}" hint-size="390px,844px"></dc-import>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const G=[
 ['1 · Onboarding','Four short screens, then login. Step 3 asks who the cut is for, hair type and styles; all optional, editable in Profile. Email link, Apple or Google. No phone number anywhere.',[['onb1','Onboarding 1 · What it does'],['onb2','Onboarding 2 · Choose city'],['onbHair','Onboarding 3 · About your hair'],['onb3','Onboarding 4 · Allow notifications'],['login','Login']]],
 ['2 · Home / Search','Live queue hint sits on the photo so it reads before the name. Chips are multi-select; selected = black fill.',[['home','Home / Search'],['map','Home / Search · Map']]],
 ['3–4 · Provider profile and booking','Book and Join queue are pinned. Booking runs as one bottom sheet with five steps; payment is stated on the review step.',[['profile','Provider profile'],['bSvc','Booking 1 · Service'],['bSty','Booking 2 · Stylist'],['bTime','Booking 3 · Day and time'],['bNote','Booking 4 · Note'],['bReview','Booking 5 · Review and confirm'],['bDone','Booking · Confirmation']]],
 ['5 · Queue status','The hero screen. The whole field changes per state (neutral, red, ink) and the label always says the state in words.',[['qJoin','Join queue sheet'],['qWait','Queue status · Waiting'],['qNext',"Queue status · You're next"],['qServe','Queue status · Serving'],['push','Push notification'],['live','Lock-screen live activity']]],
 ['6–8 · Bookings, review, settings','',[['bookings','My bookings','up'],['bookings','My bookings · Past','past'],['review','Review'],['settings','Profile and settings']]],
 ['9 · Empty, loading and error states','',[['loadSearch','Search · Loading'],['emptySearch','Search · Empty'],['errQueue','Queue · Error'],['emptyBookings','My bookings · Empty']]],
 ['Light mode','Same tokens, light ground. For daylight users who switch, and for the stores.',[['home','Home / Search · Light',null,'light'],['profile','Provider profile · Light',null,'light'],['qWait','Queue status · Waiting · Light',null,'light'],['bReview','Booking 5 · Light',null,'light']]]];
class Component extends DCLogic {
  renderVals(){ let n=0; return { groups:G.map(([gn,note,fr])=>({n:gn,note,frames:fr.map(([k,label,btab,theme])=>{n++;return {k,label,btab:btab||'up',theme:theme||'dark',num:String(n).padStart(2,'0'),id:'c'+String(n).padStart(2,'0')};})})) }; }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="pn.css">
<style>body{margin:0;background:#0b0b0c}a{color:#7aa2ff}a:hover{color:#3b74ff}</style>
</helmet>
<div style="width:1440px;padding:64px;background:#0b0b0c;color:#fafafa;font-family:var(--font-body)">
  <div style="display:flex;align-items:flex-end;gap:48px;border-bottom:2px solid #ffffff26;padding-bottom:24px;margin-bottom:16px">
    <div><div style="font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7aa2ff">05</div><h1 style="font-size:72px;letter-spacing:-.04em;margin:0;line-height:1">Open questions</h1></div>
    <p style="max-width:560px;margin:0;font-size:17px;color:#a1a1aa">Where the brief was silent, a decision is already in the design. Each one is listed so the team can confirm or overturn it.</p>
    <div style="display:flex;gap:16px;font-size:15px;margin-left:auto"><a href="00 Cover and Direction.dc.html">00 Cover</a><a href="04 Flows.dc.html">04 Flows</a></div>
  </div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <section style="display:grid;grid-template-columns:240px 1fr;gap:40px;padding:28px 0;border-bottom:2px solid #ffffff26">
      <h2 style="font-size:26px;margin:0">{{ g.n }}</h2>
      <div>
        <div style="display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,1fr);gap:20px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a1a1aa;padding-bottom:8px;border-bottom:2px solid #ffffff26"><span>#</span><span>Decision in the design</span><span>Question for the team</span></div>
        <sc-for list="{{ g.items }}" as="q" hint-placeholder-count="3">
          <div style="display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding:14px 0;border-bottom:1px solid #ffffff26;font-size:16px">
            <span style="font-weight:700;color:#7aa2ff">{{ q.id }}</span><span style="text-wrap:pretty">{{ q.d }}</span><span style="color:#a1a1aa;text-wrap:pretty">{{ q.q }}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const G=[
 ['Visual system',[
  ['Neutral style for now: black, white, greys, Geist, 12 px corners. Blue for action and selection, red for decline and "You\'re next".','When the name is chosen, does the brand colour replace blue, or sit next to it?'],
  ['"You\'re next" turns the whole queue screen red because it is the one moment the Client must act.','Is red right here, or does it read as an error? Alternative: blue field.'],
  ['Photos show in full colour; placeholders mark where they go.','Who supplies the first real photos for the example Providers?'],
  ['Dark is default for the app; light is a full alternative.','Should the Provider dashboard default to light, since shops are often bright?']]],
 ['Onboarding profile',[
  ['New step 3 asks: cuts for (Men\'s, Women\'s, Kids, No preference), hair type, specialists wanted, styles. All optional, editable in Profile.','Use it only to sort results, or also to hide non-matching Providers?'],
  ['We ask hair type and "specialists in" (African hair, Turkish barber…) instead of origin. Ethnic origin is special-category data under DSGVO Art. 9.','Legal check: is the specialist preference fine without explicit consent?'],
  ['Shops never see these answers.','Would Providers benefit from seeing hair type before a booking (e.g. braids length)?']]],
 ['Client app',[
  ['Queue join requires a service choice so the shop can plan; Stylist is optional.','Do shops want to restrict the queue to certain services (no braids by walk-in)?'],
  ['A client may be in one queue at a time and must be within ~15 min walk (soft hint, not enforced).','Enforce distance with location, or trust?'],
  ['Free cancellation until 2 h before; no fee in v1 because there is no payment.','What happens after repeated no-shows? Warning, then block from bookings at that Provider?'],
  ["At the desk the Client says their display name. No codes or QR.",'Is a name enough when two Yusufs are in the queue? Add a 2-digit number?'],
  ['Mobile Providers (Ama) take requests, not instant bookings, and show "from" prices.','Who sets the final price for braids, and when does the Client see it?'],
  ['Reviews only after a booking or queue visit marked Done by the Provider.','Can Providers reply to reviews? Can they report one?']]],
 ['Provider dashboard',[
  ['Next calls the first person to the first free Stylist; Skip moves them one place down, not to the end.','Should Skip ask why (not here, wrong service) to feed the wait estimate?'],
  ['Wait estimate = people ahead × average service time of their chosen services, per free chair.','Is the dashboard allowed to show this estimate to Clients from day one, or only after a week of data?'],
  ['Verification needs an ID plus a shop photo; business registration is optional.','Legal check: what does the platform need to list unregistered Providers in DE?'],
  ['Booking requests auto-decline after 24 h.','Shorter for same-day requests?']]],
 ['Scope and handover',[
  ['Frame names follow the brief; docs/app-sketch.md was not available here.','Share the file or confirm the names match.'],
  ['Exports: PNG 2x per frame and a PDF of page 04 are produced from these files.','Confirm the folder layout under docs/design/exports/ (one folder per page?).'],
  ['Platform admin is out of scope; Stats is marked Later.','Which stats does a Provider need in v1, if any?']]]];
class Component extends DCLogic { renderVals(){ let n=0; return { groups:G.map(([gn,items])=>({n:gn,items:items.map(([d,q])=>({id:String(++n).padStart(2,'0'),d,q}))})) }; } }
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="pn.css">
<style>body{margin:0;background:#09090b}a{color:#7aa2ff}a:hover{color:#3b74ff}</style>
</helmet>
<div style="padding:64px;background:#09090b;color:#fafafa;font-family:var(--font-body);min-width:max-content">
  <div style="display:flex;align-items:flex-end;gap:48px;border-bottom:2px solid #ffffff26;padding-bottom:24px;margin-bottom:48px">
    <div><div style="font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7aa2ff">03</div><h1 style="font-size:72px;letter-spacing:-.04em;margin:0;line-height:1">Provider dashboard</h1></div>
    <p style="max-width:620px;margin:0;font-size:17px;color:#a1a1aa">Desktop 1440 × 900 and tablet 1024 × 768. Same tokens as the app, smaller type, denser rows, fewer reds. Today is live: Next, Skip, Done and Add walk-in all work.</p>
    <div style="display:flex;gap:16px;font-size:15px;margin-left:auto"><a href="00 Cover and Direction.dc.html">00 Cover</a><a href="01 Design System.dc.html">01 System</a><a href="02 Client App.dc.html">02 Client</a><a href="04 Flows.dc.html">04 Flows</a><a href="05 Open Questions.dc.html">05 Questions</a></div>
  </div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
    <section style="margin-bottom:72px">
      <h2 style="font-size:32px;letter-spacing:-.02em;margin:0 0 6px">{{ g.n }}</h2>
      <p style="margin:0 0 24px;color:#a1a1aa;font-size:16px;max-width:900px">{{ g.note }}</p>
      <div style="display:flex;gap:48px;align-items:flex-start">
        <sc-for list="{{ g.frames }}" as="f" hint-placeholder-count="2">
          <div data-frame="{{ f.id }}" style="display:flex;flex-direction:column;gap:12px">
            <div style="font-size:14px;font-weight:700;display:flex;gap:10px"><span style="color:#7aa2ff">{{ f.num }}</span>{{ f.label }}</div>
            <div style="box-shadow:0 0 0 1px #ffffff1f,0 24px 60px #000">
              <dc-import name="Provider Screen" screen="{{ f.k }}" device="{{ f.device }}" theme="{{ f.theme }}" style="width:{{ f.w }};height:{{ f.h }};display:block" hint-size="1440px,900px"></dc-import>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const D=['desktop','dark'],T=['tablet','dark'],L=['desktop','light'];
const G=[
 ['1 · Onboarding wizard','Four steps to go live; the rest can wait. No tax number or registration required to start.',[['wizType','Onboarding wizard · Provider type',D],['wizServices','Onboarding wizard · Services and prices',D]]],
 ['2 · Today','Calendar per Stylist on the left, live queue on the right. On tablet the queue takes more than half and the actions sit in the thumb zone, 84 px tall.',[['today','Today · Desktop',D],['today','Today · Tablet',T],['today','Today · Desktop · Light',L]]],
 ['3 · Calendar','Week per Stylist. Requests are dashed, blocked time is hatched, no-shows carry a label, not only a colour.',[['calendar','Calendar · Desktop',D],['calendar','Calendar · Tablet',T]]],
 ['4–7 · Services, portfolio, stylists, settings','',[['services','Services and prices',D],['portfolio','Portfolio',D]]],
 ['','',[['stylists','Stylists',D],['settings','Settings and verification',D]]],
 ['8 · Stats (later)','Not in v1. Shown so the nav slot and data model are planned.',[['stats','Stats (later)',D]]]];
class Component extends DCLogic {
  renderVals(){ let n=0; return { groups:G.map(([gn,note,fr])=>({n:gn,note,frames:fr.map(([k,label,[device,theme]])=>{n++;const t=device==='tablet';return {k,label,device,theme,w:t?'1024px':'1440px',h:t?'768px':'900px',num:'P'+String(n).padStart(2,'0'),id:'p'+String(n).padStart(2,'0')};})})) }; }
}
</script>
</body>
</html>
